<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#5C4F4A" />
    <title>Bella Tavola</title>
    <style>
      /* ============================================================
       RESET & TOKENS
    ============================================================ */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --cream: #ede9e6;
        --tan: #c9996b;
        --brown: #5c4f4a;
        --teal: #5c766d;
        --white: #f7f4f1;
        --text: #2c2220;
        --muted: #8c7f7b;
        --border: #dedad7;
        --safe-t: env(safe-area-inset-top, 0px);
        --safe-b: env(safe-area-inset-bottom, 0px);
      }

      html {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: var(--cream);
        color: var(--text);
        min-height: 100dvh;
        -webkit-font-smoothing: antialiased;
        overscroll-behavior: none;
      }

      button {
        cursor: pointer;
        -webkit-appearance: none;
        appearance: none;
        font-family: inherit;
      }
      input,
      textarea {
        -webkit-appearance: none;
        appearance: none;
        border-radius: 0;
        font-family: inherit;
      }
      img {
        display: block;
      }

      /* ============================================================
       SCREENS
    ============================================================ */
      .screen {
        display: none;
        min-height: 100dvh;
        flex-direction: column;
      }
      .screen.active {
        display: flex;
      }

      /* ============================================================
       WELCOME
    ============================================================ */
      #s-welcome {
        background: var(--brown);
        position: relative;
        overflow: hidden;
        justify-content: flex-end;
      }

      .w-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.18;
      }

      .w-top {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: calc(2.25rem + var(--safe-t)) 1.5rem 0;
      }

      .logo-block {
        width: 44px;
        height: 44px;
        background: var(--tan);
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 1.25rem;
      }
      .logo-block svg {
        width: 22px;
        height: 22px;
        stroke: var(--cream);
        fill: none;
        stroke-width: 1.8;
      }

      .w-name {
        font-size: clamp(2.2rem, 9vw, 3rem);
        font-weight: 800;
        color: var(--cream);
        line-height: 1;
        letter-spacing: -0.03em;
      }

      .w-sub {
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(237, 233, 230, 0.42);
        margin-top: 0.45rem;
      }

      .w-form {
        position: relative;
        z-index: 1;
        background: var(--cream);
        padding: 1.75rem 1.5rem calc(1.75rem + var(--safe-b));
      }

      .table-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        background: var(--teal);
        color: #fff;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        padding: 0.3rem 0.7rem;
        margin-bottom: 1.4rem;
      }
      .table-tag svg {
        width: 10px;
        height: 10px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .f-lbl {
        display: block;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }

      .f-inp {
        width: 100%;
        padding: 0.875rem 1rem;
        border: 1.5px solid var(--border);
        background: #fff;
        font-size: 1rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.18s;
      }
      .f-inp:focus {
        border-color: var(--tan);
      }
      .f-inp.shake {
        border-color: #c05050;
        animation: shake 0.35s;
      }
      .f-inp::placeholder {
        color: #bdb5b1;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-6px);
        }
        75% {
          transform: translateX(6px);
        }
      }

      .btn-go {
        display: block;
        width: 100%;
        padding: 1rem;
        margin-top: 0.75rem;
        background: var(--brown);
        color: var(--cream);
        border: none;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-go:active {
        transform: scale(0.98);
        background: #4a3f3a;
      }

      /* ============================================================
       MENU
    ============================================================ */
      #s-menu {
        background: var(--cream);
      }

      .m-sticky {
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .m-header {
        background: var(--brown);
        padding: calc(0.875rem + var(--safe-t)) 1.25rem 0.875rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .mh-left {
        display: flex;
        flex-direction: column;
      }
      .mh-name {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--cream);
        letter-spacing: -0.01em;
      }
      .mh-sub {
        font-size: 0.68rem;
        color: rgba(237, 233, 230, 0.5);
        margin-top: 2px;
      }

      .cart-btn {
        position: relative;
        background: none;
        border: none;
        color: var(--cream);
        padding: 0.375rem;
        display: flex;
        align-items: center;
      }
      .cart-btn svg {
        width: 26px;
        height: 26px;
        stroke: currentColor;
        fill: none;
        stroke-width: 1.7;
      }

      .cart-badge {
        position: absolute;
        top: -1px;
        right: -1px;
        background: var(--tan);
        color: #fff;
        font-size: 0.58rem;
        font-weight: 800;
        min-width: 16px;
        height: 16px;
        display: none;
        align-items: center;
        justify-content: center;
        padding: 0 3px;
      }
      .cart-badge.on {
        display: flex;
      }

      /* category tabs */
      .cat-nav {
        background: var(--brown);
        display: flex;
        overflow-x: auto;
        scrollbar-width: none;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
      }
      .cat-nav::-webkit-scrollbar {
        display: none;
      }

      .c-tab {
        flex-shrink: 0;
        padding: 0.6rem 1.1rem;
        font-size: 0.7rem;
        font-weight: 700;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: rgba(237, 233, 230, 0.42);
        background: none;
        border: none;
        border-bottom: 2px solid transparent;
        white-space: nowrap;
        transition:
          color 0.15s,
          border-color 0.15s;
      }
      .c-tab.on {
        color: var(--tan);
        border-bottom-color: var(--tan);
      }

      /* menu body */
      .m-body {
        flex: 1;
        padding-bottom: calc(76px + var(--safe-b));
      }

      .cat-sec {
        display: none;
      }
      .cat-sec.on {
        display: block;
      }

      .cat-h {
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--brown);
        letter-spacing: -0.02em;
        padding: 1.25rem 1rem 0.7rem;
      }

      /* 2-column grid */
      .item-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1px;
        background: var(--border);
      }

      .item-card {
        background: var(--white);
        display: flex;
        flex-direction: column;
      }

      .ic-img-wrap {
        aspect-ratio: 4 / 3;
        overflow: hidden;
        background: #d9d5d2;
      }

      .ic-img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 0.35s ease;
      }
      .item-card:active .ic-img {
        transform: scale(1.04);
      }

      .ic-body {
        padding: 0.625rem 0.75rem 0.75rem;
        flex: 1;
        display: flex;
        flex-direction: column;
      }

      .ic-name {
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--brown);
        line-height: 1.2;
        margin-bottom: 0.2rem;
      }

      .ic-desc {
        font-size: 0.68rem;
        color: var(--muted);
        line-height: 1.35;
        flex: 1;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }

      .ic-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .ic-price {
        font-size: 0.88rem;
        font-weight: 800;
        color: var(--teal);
      }

      /* add button */
      .add-btn {
        width: 30px;
        height: 30px;
        background: var(--brown);
        color: var(--cream);
        border: none;
        font-size: 1.3rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .add-btn:active {
        transform: scale(0.85);
        background: var(--tan);
      }

      /* qty control */
      .qty-c {
        display: flex;
        align-items: center;
      }

      .qty-btn {
        width: 28px;
        height: 28px;
        background: var(--cream);
        border: 1px solid var(--border);
        color: var(--brown);
        font-size: 0.95rem;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.12s;
      }
      .qty-btn:active {
        background: var(--border);
      }

      .qty-n {
        width: 28px;
        height: 28px;
        line-height: 26px;
        text-align: center;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--brown);
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
      }

      /* cart bar */
      .cart-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--brown);
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 0.875rem 1.25rem calc(0.875rem + var(--safe-b));
        z-index: 200;
        box-shadow: 0 -2px 20px rgba(0, 0, 0, 0.18);
      }
      .cart-bar.on {
        display: flex;
      }

      .cb-info {
        color: var(--cream);
      }
      .cb-cnt {
        font-size: 0.68rem;
        color: rgba(237, 233, 230, 0.55);
        margin-bottom: 2px;
      }
      .cb-tot {
        font-size: 1.05rem;
        font-weight: 800;
      }

      .cb-btn {
        background: var(--tan);
        color: #fff;
        border: none;
        font-size: 0.78rem;
        font-weight: 700;
        letter-spacing: 0.07em;
        text-transform: uppercase;
        padding: 0.65rem 1.2rem;
        transition: background 0.15s;
      }
      .cb-btn:active {
        background: #b08050;
      }

      /* ============================================================
       SHARED: BACK HEADER
    ============================================================ */
      .bk-header {
        background: var(--brown);
        padding: calc(0.875rem + var(--safe-t)) 1.25rem 0.875rem;
        display: flex;
        align-items: center;
        gap: 0.875rem;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .bk-btn {
        background: none;
        border: none;
        color: var(--cream);
        display: flex;
        align-items: center;
        padding: 0.2rem 0;
      }
      .bk-btn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        fill: none;
        stroke-width: 2;
      }

      .bk-title {
        font-size: 0.95rem;
        font-weight: 700;
        color: var(--cream);
      }

      /* ============================================================
       CART SCREEN
    ============================================================ */
      #s-cart {
        background: var(--cream);
      }

      .cart-scroll {
        flex: 1;
        overflow-y: auto;
        padding-bottom: calc(84px + var(--safe-b));
      }

      .cart-list {
        background: var(--white);
      }

      .cart-row {
        display: flex;
        align-items: center;
        gap: 0.875rem;
        padding: 0.875rem 1.25rem;
        border-bottom: 1px solid var(--border);
      }

      .cr-img {
        width: 54px;
        height: 54px;
        object-fit: cover;
        flex-shrink: 0;
      }

      .cr-info {
        flex: 1;
        min-width: 0;
      }
      .cr-name {
        font-size: 0.875rem;
        font-weight: 600;
        color: var(--brown);
      }
      .cr-price {
        font-size: 0.75rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .sum-box {
        background: var(--white);
        margin-top: 8px;
        padding: 1.25rem;
      }

      .sum-row {
        display: flex;
        justify-content: space-between;
        font-size: 0.875rem;
        color: var(--text);
        margin-bottom: 0.5rem;
      }
      .sum-row:last-child {
        margin-bottom: 0;
      }
      .sum-row.grand {
        border-top: 1px solid var(--border);
        padding-top: 0.7rem;
        margin-top: 0.25rem;
        font-weight: 800;
        font-size: 0.95rem;
        color: var(--brown);
      }

      .notes-box {
        background: var(--white);
        margin-top: 8px;
        padding: 1.25rem;
      }
      .notes-lbl {
        display: block;
        font-size: 0.65rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.6rem;
      }
      .notes-ta {
        width: 100%;
        padding: 0.75rem;
        border: 1.5px solid var(--border);
        background: var(--cream);
        font-size: 0.875rem;
        color: var(--text);
        resize: none;
        outline: none;
        transition: border-color 0.2s;
      }
      .notes-ta:focus {
        border-color: var(--tan);
      }

      .cart-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--cream);
        border-top: 1px solid var(--border);
        padding: 1rem 1.25rem calc(1rem + var(--safe-b));
        z-index: 200;
      }

      .btn-block {
        display: block;
        width: 100%;
        padding: 1rem;
        border: none;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        transition:
          background 0.15s,
          transform 0.1s;
      }
      .btn-block:active {
        transform: scale(0.98);
      }
      .btn-block.tan {
        background: var(--tan);
        color: #fff;
      }
      .btn-block.brown {
        background: var(--brown);
        color: var(--cream);
      }
      .btn-block.tan:active {
        background: #b08050;
      }
      .btn-block.brown:active {
        background: #4a3f3a;
      }

      /* empty state */
      .empty-st {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 4rem 2rem;
        text-align: center;
        color: var(--muted);
      }
      .empty-st svg {
        width: 48px;
        height: 48px;
        stroke: var(--muted);
        fill: none;
        opacity: 0.28;
        margin-bottom: 1rem;
      }
      .empty-st p {
        font-size: 0.875rem;
      }

      /* ============================================================
       CHECKOUT
    ============================================================ */
      #s-checkout {
        background: var(--cream);
      }

      .co-scroll {
        flex: 1;
        overflow-y: auto;
        padding-bottom: calc(118px + var(--safe-b));
      }

      .co-sec {
        background: var(--white);
        padding: 1.25rem;
        margin-bottom: 8px;
      }

      .co-lbl {
        display: block;
        font-size: 0.62rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      /* who's ordering */
      .who-row {
        display: flex;
        align-items: center;
        gap: 0.875rem;
      }
      .who-av {
        width: 40px;
        height: 40px;
        background: var(--tan);
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-size: 1.05rem;
        font-weight: 800;
      }
      .who-name {
        font-size: 0.925rem;
        font-weight: 700;
        color: var(--brown);
      }
      .who-table {
        font-size: 0.72rem;
        color: var(--muted);
        margin-top: 2px;
      }

      /* payment options */
      .pay-opt {
        display: flex;
        align-items: center;
        gap: 0.875rem;
        padding: 0.875rem 1rem;
        border: 1.5px solid var(--border);
        background: transparent;
        width: 100%;
        text-align: left;
        margin-bottom: 0.5rem;
        transition: border-color 0.15s;
      }
      .pay-opt:last-of-type {
        margin-bottom: 0;
      }
      .pay-opt.sel {
        border-color: var(--tan);
        background: rgba(201, 153, 107, 0.04);
      }

      .po-ico {
        width: 34px;
        height: 34px;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .po-ico svg {
        width: 20px;
        height: 20px;
      }

      .po-txt {
        flex: 1;
      }
      .po-name {
        font-size: 0.875rem;
        font-weight: 700;
        color: var(--brown);
      }
      .po-desc {
        font-size: 0.7rem;
        color: var(--muted);
        margin-top: 2px;
      }

      .radio-dot {
        width: 18px;
        height: 18px;
        border: 2px solid var(--border);
        border-radius: 50%;
        flex-shrink: 0;
        position: relative;
        transition: border-color 0.15s;
      }
      .pay-opt.sel .radio-dot {
        border-color: var(--tan);
      }
      .pay-opt.sel .radio-dot::after {
        content: "";
        position: absolute;
        inset: 3px;
        background: var(--tan);
        border-radius: 50%;
      }

      /* card form */
      .card-form {
        display: none;
        margin-top: 1rem;
      }
      .card-form.on {
        display: block;
      }

      .f-field {
        margin-bottom: 0.6rem;
      }
      .f-fl {
        display: block;
        font-size: 0.62rem;
        font-weight: 700;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 0.35rem;
      }
      .f-fi {
        width: 100%;
        padding: 0.75rem 0.875rem;
        border: 1.5px solid var(--border);
        background: var(--cream);
        font-size: 0.9rem;
        color: var(--text);
        outline: none;
        transition: border-color 0.18s;
      }
      .f-fi:focus {
        border-color: var(--tan);
      }
      .f-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.5rem;
      }

      /* checkout order summary */
      .co-srow {
        display: flex;
        justify-content: space-between;
        font-size: 0.84rem;
        color: var(--text);
        margin-bottom: 0.4rem;
      }
      .co-srow.total {
        border-top: 1px solid var(--border);
        padding-top: 0.6rem;
        margin-top: 0.25rem;
        font-weight: 800;
        font-size: 0.92rem;
        color: var(--brown);
        margin-bottom: 0;
      }

      /* checkout footer */
      .co-footer {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: var(--white);
        border-top: 1px solid var(--border);
        padding: 1rem 1.25rem calc(1rem + var(--safe-b));
        z-index: 200;
      }
      .co-total-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 0.7rem;
      }
      .co-tlbl {
        font-size: 0.75rem;
        color: var(--muted);
        font-weight: 600;
      }
      .co-tamt {
        font-size: 1.3rem;
        font-weight: 800;
        color: var(--brown);
      }

      /* ============================================================
       CONFIRMATION
    ============================================================ */
      #s-confirm {
        background: var(--cream);
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2.5rem 1.5rem calc(2.5rem + var(--safe-b));
        padding-top: calc(2.5rem + var(--safe-t));
      }

      .conf-check {
        width: 68px;
        height: 68px;
        background: var(--teal);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
      }
      .conf-check svg {
        width: 32px;
        height: 32px;
        stroke: #fff;
        fill: none;
        stroke-width: 2.5;
      }

      .conf-h {
        font-size: 1.65rem;
        font-weight: 800;
        color: var(--brown);
        letter-spacing: -0.025em;
        margin-bottom: 0.5rem;
      }
      .conf-p {
        font-size: 0.875rem;
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 2rem;
      }

      .conf-card {
        background: var(--white);
        padding: 1.25rem;
        width: 100%;
        max-width: 340px;
        text-align: left;
        margin-bottom: 2rem;
      }
      .conf-row {

          {

          },
        ],
      };

      /* ----------------------------------------------------------
   STATE
---------------------------------------------------------- */
      const ST = {
        user: null,
        deviceId: null,
        tableNum: 3,
        cart: {}, // { id: { item, qty } }
        payMethod: "restaurant",
      };

      /* ----------------------------------------------------------
   INIT
---------------------------------------------------------- */
      (function init() {
        // Table from ?table=N
        const p = new URLSearchParams(location.search);
        ST.tableNum = parseInt(p.get("table")) || 3;
        document.getElementById("tnum").textContent = ST.tableNum;
        document.getElementById("h-tnum").textContent = ST.tableNum;

        // Persistent device ID
        let did = localStorage.getItem("cc_did");
        if (!did) {
          did =
            "D" +
            Date.now().toString(36).toUpperCase() +
            Math.random().toString(36).slice(2, 6).toUpperCase();
          localStorage.setItem("cc_did", did);
        }
        ST.deviceId = did;

        // Pre-fill returning user
        const saved = localStorage.getItem("cc_name");
        if (saved) document.getElementById("name-inp").value = saved;

        buildMenuDOM();
        detectWallets();
        setupCardFormatting();
      })();

      /* ----------------------------------------------------------
   WALLET DETECTION
---------------------------------------------------------- */
      function detectWallets() {
        if (window.ApplePaySession) {
          try {
            if (ApplePaySession.canMakePayments())
              document.getElementById("apple-opt").style.display = "flex";
          } catch (e) {}
        }
        if (window.PaymentRequest && !window.ApplePaySession) {
          document.getElementById("gpay-opt").style.display = "flex";
        }
      }

      /* ----------------------------------------------------------
   SESSION START
---------------------------------------------------------- */
      function startSession() {
        const inp = document.getElementById("name-inp");
        const name = inp.value.trim();
        if (!name) {
          inp.classList.add("shake");
          inp.focus();
          setTimeout(() => inp.classList.remove("shake"), 400);
          return;
        }
        ST.user = name;
        localStorage.setItem("cc_name", name);

        document.getElementById("h-name").textContent = name;
        document.getElementById("co-av").textContent = name[0].toUpperCase();
        document.getElementById("co-uname").textContent = name;
        document.getElementById("co-utbl").textContent = "Table " + ST.tableNum;

        goScreen("s-menu");
      }

      /* Enter key on name input */
      document.getElementById("name-inp").addEventListener("keydown", (e) => {
        if (e.key === "Enter") startSession();
      });

      /* ----------------------------------------------------------
   SCREEN ROUTING
---------------------------------------------------------- */
      function goScreen(id) {
        document
          .querySelectorAll(".screen")
          .forEach((s) => s.classList.remove("active"));
        document.getElementById(id).classList.add("active");
        window.scrollTo(0, 0);
      }

      function goMenu() {
        goScreen("s-menu");
      }

      function goCart() {
        renderCart();
        goScreen("s-cart");
      }

      function goCheckout() {
        if (!cartCount()) {
          toast("Your cart is empty");
          return;
        }
        renderCheckoutSummary();
        goScreen("s-checkout");
      }

      /* ----------------------------------------------------------
   MENU DOM
---------------------------------------------------------- */
      function buildMenuDOM() {
        const body = document.getElementById("m-body");
        body.innerHTML = "";

        CATS.forEach((cat) => {
          const sec = document.createElement("div");
          sec.className = "cat-sec" + (cat === "pizzas" ? " on" : "");
          sec.id = "sec-" + cat;

          const h = document.createElement("h2");
          h.className = "cat-h";
          h.textContent = CAT_NAMES[cat];
          sec.appendChild(h);

          const grid = document.createElement("div");
          grid.className = "item-grid";
          MENU[cat].forEach((item) => grid.appendChild(makeCard(item)));
          sec.appendChild(grid);

          body.appendChild(sec);
        });
      }

      function makeCard(item) {
        const el = document.createElement("div");
        el.className = "item-card";
        el.id = "icard-" + item.id;
        el.innerHTML = `
    <div class="ic-img-wrap">
      <img class="ic-img" loading="lazy"
        src="${item.img}?auto=compress&cs=tinysrgb&w=320&h=240&dpr=1&fit=crop"
        alt="${item.name}" width="160" height="120"
        onerror="this.parentElement.style.background='#C9996B1A'" />
    </div>
    <div class="ic-body">
      <div class="ic-name">${item.name}</div>
      <div class="ic-desc">${item.desc}</div>
      <div class="ic-foot">
        <span class="ic-price">$${item.price.toFixed(2)}</span>
        <div id="ctrl-${item.id}">${ctrlHTML(item.id, ST.cart[item.id]?.qty || 0)}</div>
      </div>
    </div>`;
        return el;
      }

      function ctrlHTML(id, qty) {
        if (qty === 0) {
          return `<button class="add-btn" onclick="addItem('${id}')" aria-label="Add to cart">+</button>`;
        }
        return `<div class="qty-c">
    <button class="qty-btn" onclick="remItem('${id}')" aria-label="Remove one">−</button>
    <span class="qty-n">${qty}</span>
    <button class="qty-btn" onclick="addItem('${id}')" aria-label="Add one">+</button>
  </div>`;
      }

      function switchCat(btn, cat) {
        document.querySelectorAll(".c-tab").forEach((t) => {
          t.classList.remove("on");
          t.setAttribute("aria-selected", "false");
        });
        btn.classList.add("on");
        btn.setAttribute("aria-selected", "true");
        document
          .querySelectorAll(".cat-sec")
          .forEach((s) => s.classList.toggle("on", s.id === "sec-" + cat));
      }

      /* ----------------------------------------------------------
   CART LOGIC
---------------------------------------------------------- */
      function findItem(id) {
        for (const cat of CATS) {
          const it = MENU[cat].find((i) => i.id === id);
          if (it) return it;
        }
      }

      function addItem(id) {
        const item = findItem(id);
        if (!item) return;
        if (!ST.cart[id]) ST.cart[id] = { item, qty: 0 };
        ST.cart[id].qty++;
        refreshCtrl(id);
        refreshCartBar();
        toast(item.name + " added");
      }

      function remItem(id) {
        if (!ST.cart[id]) return;
        if (--ST.cart[id].qty <= 0) delete ST.cart[id];
        refreshCtrl(id);
        refreshCartBar();
      }

      function refreshCtrl(id) {
        const el = document.getElementById("ctrl-" + id);
        if (el) el.innerHTML = ctrlHTML(id, ST.cart[id]?.qty || 0);
      }

      function cartCount() {
        return Object.values(ST.cart).reduce((a, e) => a + e.qty, 0);
      }

      function cartTotals() {
        let count = 0,
          sub = 0;
        for (const { item, qty } of Object.values(ST.cart)) {
          count += qty;
          sub += item.price * qty;
        }
        const tax = sub * 0.08;
        return { count, sub, tax, grand: sub + tax };
      }

      function refreshCartBar() {
        const { count, grand } = cartTotals();
        const badge = document.getElementById("c-badge");
        const bar = document.getElementById("c-bar");

        if (count > 0) {
          badge.textContent = count > 9 ? "9+" : count;
          badge.classList.add("on");
          bar.classList.add("on");
          document.getElementById("cb-cnt").textContent =
            count + " item" + (count !== 1 ? "s" : "");
          document.getElementById("cb-tot").textContent =
            "$" + grand.toFixed(2);
        } else {
          badge.classList.remove("on");
          bar.classList.remove("on");
        }
      }

      /* ----------------------------------------------------------
   CART SCREEN
---------------------------------------------------------- */
      function renderCart() {
        const scroll = document.getElementById("cart-scroll");
        const footer = document.getElementById("cart-footer");
        const { count, sub, tax, grand } = cartTotals();

        if (!count) {
          footer.style.display = "none";
          scroll.innerHTML = `<div class="empty-st">
      <svg viewBox="0 0 24 24" stroke-width="1.4">
        <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/>
        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
      </svg>
      <p>Your cart is empty</p>
    </div>`;
          return;
        }

        footer.style.display = "block";

        let rows = "";
        for (const { item, qty } of Object.values(ST.cart)) {
          rows += `<div class="cart-row">
      <img class="cr-img"
        src="${item.img}?auto=compress&cs=tinysrgb&w=120&h=120&dpr=1&fit=crop"
        alt="${item.name}" loading="lazy" width="54" height="54" />
      <div class="cr-info">
        <div class="cr-name">${item.name}</div>
        <div class="cr-price">$${(item.price * qty).toFixed(2)}</div>
      </div>
      <div class="qty-c">
        <button class="qty-btn" onclick="remItem('${item.id}');renderCart();" aria-label="Remove one">−</button>
        <span class="qty-n">${qty}</span>
        <button class="qty-btn" onclick="addItem('${item.id}');renderCart();" aria-label="Add one">+</button>
      </div>
    </div>`;
        }

        scroll.innerHTML = `
    <div class="cart-list">${rows}</div>
    <div class="sum-box">
      <div class="sum-row"><span>Subtotal</span><span>$${sub.toFixed(2)}</span></div>
      <div class="sum-row"><span>Tax (8%)</span><span>$${tax.toFixed(2)}</span></div>
      <div class="sum-row grand"><span>Total</span><span>$${grand.toFixed(2)}</span></div>
    </div>
    <div class="notes-box">
      <label class="notes-lbl" for="cart-notes">Special instructions</label>
      <textarea class="notes-ta" id="cart-notes" rows="3"
        placeholder="Allergies, modifications, requests…"></textarea>
    </div>`;
      }

      /* ----------------------------------------------------------
   CHECKOUT
---------------------------------------------------------- */
      function selPay(btn, method) {
        ST.payMethod = method;
        document
          .querySelectorAll(".pay-opt")
          .forEach((o) => o.classList.remove("sel"));
        btn.classList.add("sel");
        document
          .getElementById("card-form")
          .classList.toggle("on", method === "card");

        const labels = {
          restaurant: "Place Order",
          card: "Pay Now",
          applepay: "Pay with Apple Pay",
          googlepay: "Pay with Google Pay",
        };
        document.getElementById("pay-btn").textContent =
          labels[method] || "Place Order";
      }

      function renderCheckoutSummary() {
        const { sub, tax, grand } = cartTotals();
        let html = "";
        for (const { item, qty } of Object.values(ST.cart)) {
          html += `<div class="co-srow"><span>${item.name} ×${qty}</span><span>$${(item.price * qty).toFixed(2)}</span></div>`;
        }
        html += `<div class="co-srow" style="margin-top:.375rem"><span>Tax (8%)</span><span>$${tax.toFixed(2)}</span></div>`;
        html += `<div class="co-srow total"><span>Total</span><span>$${grand.toFixed(2)}</span></div>`;
        document.getElementById("co-sum").innerHTML = html;
        document.getElementById("co-tamt").textContent = "$" + grand.toFixed(2);
      }

      function placeOrder() {
        const { count, grand } = cartTotals();
        if (!count) {
          toast("Your cart is empty");
          return;
        }

        if (ST.payMethod === "card") {
          const num = document
            .getElementById("cc-num")
            .value.replace(/\s/g, "");
          const exp = document
            .getElementById("cc-exp")
            .value.replace(/\s/g, "");
          const cvv = document.getElementById("cc-cvv").value;
          if (num.length < 16 || exp.length < 4 || cvv.length < 3) {
            toast("Please complete your card details");
            return;
          }
        }

        const orderId = "BT-" + Date.now().toString(36).toUpperCase().slice(-6);
        const payLabel = {
          restaurant: "Pay at restaurant",
          card: "Card",
          applepay: "Apple Pay",
          googlepay: "Google Pay",
        }[ST.payMethod];

        document.getElementById("conf-card").innerHTML = `
    <div class="conf-row"><span>Order ID</span><strong>${orderId}</strong></div>
    <div class="conf-row"><span>Table</span><strong>${ST.tableNum}</strong></div>
    <div class="conf-row"><span>Name</span><strong>${ST.user}</strong></div>
    <div class="conf-row"><span>Total</span><strong>$${grand.toFixed(2)}</strong></div>
    <div class="conf-row"><span>Payment</span><strong>${payLabel}</strong></div>`;

        document.getElementById("conf-p").innerHTML =
          ST.payMethod === "restaurant"
            ? "Your order is in the kitchen.<br>Please pay when ready."
            : "Payment confirmed. Your food is being prepared.";

        // Clear cart
        ST.cart = {};
        refreshCartBar();
        buildMenuDOM(); // reset qty controls

        goScreen("s-confirm");
      }

      function addMore() {
        goScreen("s-menu");
        // reset to first tab
        const firstTab = document.querySelector(".c-tab");
        switchCat(firstTab, "pizzas");
      }

      /* ----------------------------------------------------------
   CARD INPUT FORMATTING
---------------------------------------------------------- */
      function setupCardFormatting() {
        document.getElementById("cc-num").addEventListener("input", (e) => {
          let v = e.target.value.replace(/\D/g, "").slice(0, 16);
          e.target.value = v.replace(/(.{4})(?=.)/g, "$1 ");
        });
        document.getElementById("cc-exp").addEventListener("input", (e) => {
          let v = e.target.value.replace(/\D/g, "").slice(0, 4);
          if (v.length > 2) v = v.slice(0, 2) + " / " + v.slice(2);
          e.target.value = v;
        });
      }

      /* ----------------------------------------------------------
   TOAST
---------------------------------------------------------- */
      let _tt;
      function toast(msg) {
        const el = document.getElementById("toast");
        document.getElementById("toast-msg").textContent = msg;
        el.classList.add("on");
        clearTimeout(_tt);
        _tt = setTimeout(() => el.classList.remove("on"), 2200);
      }
    </script>
  </body>
</html>
